[package]
name = "ztorrent-updater"
description = "Checks GitHub for a newer ztorrent, stages it, and swaps it in on restart"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ztorrent-core = { path = "../ztorrent-core" }
anyhow.workspace = true
serde_json.workspace = true
flume = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
