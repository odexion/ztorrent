[package]
name = "ztorrent-engine"
description = "The ztorrent engine: libtorrent session, queue, part files, egress policy and the resume session"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ztorrent-core = { path = "../ztorrent-core" }
ztorrent-lt-sys = { path = "../ztorrent-lt-sys" }
anyhow.workspace = true
serde_json.workspace = true
flume = "0.11"
base64 = "0.22"
if-addrs = "0.13"
uuid = { version = "1", features = ["v4"] }
futures-channel = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "socks", "rustls-tls"] }

[dev-dependencies]
futures-channel = "0.3"
tempfile = "3"
