[package]
name = "ztorrent-secrets"
description = "Seals the proxy password the way Electron's safeStorage did, so either build can open what the other wrote"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ztorrent-core = { path = "../ztorrent-core" }
anyhow.workspace = true
serde_json.workspace = true
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
aes-gcm = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }
