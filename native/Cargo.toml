[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
authors = ["zaf4 <zafermolbio@gmail.com>"]
repository = "https://github.com/odexion/ztorrent"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "0.3.5" }
gpui-component = "=0.6.1"
# font-kit renders text on macOS; wayland and x11 are the window backends on
# Linux, where the platform crate enables none by default.
gpui_platform = { package = "gpui-pre-platform", version = "0.3.5", features = ["font-kit", "wayland", "x11"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Built for speed: whole-program optimisation across every crate, one codegen
# unit so the optimiser sees everything, and no symbols in the shipped binary.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true
incremental = false
