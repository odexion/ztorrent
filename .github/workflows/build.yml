name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # One platform failing should not hide the artifacts from the other two.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            script: dist
            files: dist/*.dmg
          - name: windows
            os: windows-latest
            script: dist:win
            files: dist/*.exe
          - name: linux
            os: ubuntu-latest
            script: dist:linux
            files: |
              dist/*.AppImage
              dist/*.deb

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build sets npmRebuild:false — every native dependency ships N-API
      # prebuilds for each platform, so there is nothing to compile here.
      - name: Package
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          # No Developer ID in CI; without this electron-builder hunts for a
          # signing identity and logs a failure instead of building unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v7
        with:
          name: ztorrent-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    # Tag builds only; a push to main just leaves artifacts on the run.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect installers
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} release/ \;
          ls -lh release
          test -n "$(ls -A release)" || { echo 'no installers found'; exit 1; }

      # Upload into an existing release rather than failing on it. A tag can
      # already have a release before this job runs — one made by hand, or by
      # an earlier attempt at this tag — and `gh release create` refuses that,
      # which strands the installers as run artifacts.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists — uploading into it"
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              release/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              release/*
          fi
