name: native

# The Rust + GPUI build of ztorrent, which has released from v0.5.0 on.
#
# Every push tests on macOS, Linux and Windows. Installers for all six
# platform and architecture pairs are built when the workflow is run by hand,
# and for a v* tag, which also publishes them once the tests have passed too.
# A push to main runs the same release builds without packaging them, only to
# leave warm caches: a tag can read main's caches but not another tag's, so
# this is what lets a release start from nearly everything already built. The artifact names are still the
# ones electron-builder used, so an Electron install's updater and
# scripts/install.sh move it across. A tag with a suffix (v0.6.0-beta.1)
# publishes a prerelease, which `releases/latest` -- and so both of those --
# skips.
#
# Each installer is standalone: libtorrent and OpenSSL are compiled from source
# and linked in (crates/ztorrent-lt-sys/build.rs), and a check fails the job if
# the packaged app still loads anything the system does not provide.

on:
  push:
    branches: [main, rust-gpui]
    tags: ['v*']
    paths: ['crates/**', 'assets/**', 'Cargo.toml', 'Cargo.lock', 'sample-torrents/**', 'build/icon.*', '.github/workflows/native.yml', '.github/actions/native-setup/**']
  pull_request:
    paths: ['crates/**', 'assets/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/native.yml', '.github/actions/native-setup/**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main or to a pull request supersedes the run still going. A
# tag's run is never cut short.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  BOOST_VERSION: '1.92.0'
  # The packager's minimum-system-version; .cargo/config.toml sets it
  # for local builds.
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # One platform failing should not hide the others' results.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-latest }
          - { name: linux, os: ubuntu-22.04 }
          - { name: windows, os: windows-latest }

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/native-setup
        id: setup
        with:
          cache-key: test-${{ matrix.name }}

      - name: Test
        run: cargo test --locked -p ztorrent-core -p ztorrent-secrets -p ztorrent-lt-sys -p ztorrent-engine -p ztorrent-updater -p ztorrent-ui

      - name: Keep libtorrent and OpenSSL for the next run
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.native-cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/native-cache
          key: ${{ steps.setup.outputs.native-cache-key }}

      # The window crate must not reach the engine: its only way in is the
      # command set in ztorrent-core.
      - name: Check the window cannot name the engine
        run: |
          if cargo tree -p ztorrent-ui --edges normal | grep -E 'ztorrent-(engine|lt-sys)'; then
            echo 'ztorrent-ui depends on the engine'; exit 1
          fi

  # Not held back for the tests: they run alongside, and a release publishes
  # only once both have passed.
  package:
    name: package (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-latest, target: aarch64-apple-darwin, formats: dmg }
          # Cross-built on the same Apple Silicon runner: Xcode's clang and
          # openssl-src both target Intel from there.
          - { name: mac-x64, os: macos-latest, target: x86_64-apple-darwin, formats: dmg }
          - { name: win-x64, os: windows-latest, target: x86_64-pc-windows-msvc, formats: nsis }
          - { name: win-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc, formats: nsis }
          # 22.04's glibc, so the AppImage and .deb also start on older distributions.
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, formats: 'appimage,deb' }
          - { name: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, formats: 'appimage,deb' }

    defaults:
      run:
        shell: bash

    # Windows builds of a release tag are signed through SignPath once the
    # organization id is set as a repository variable (docs/development.md,
    # "Signing"); until then, and for every other build, they ship unsigned.
    # Not plain SIGN: linuxdeploy's AppImage plugin GPG-signs whenever SIGN is
    # set at all, "false" included, and fails for want of a key.
    # SHIP is false on main, where the job only builds, to warm the caches.
    env:
      SHIP: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
      SIGNPATH_SIGN: ${{ startsWith(matrix.name, 'win-') && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/native-setup
        id: setup
        with:
          target: ${{ matrix.target }}
          cache-key: package-${{ matrix.name }}

      - name: Build
        run: cargo build --release --locked -p ztorrent --target ${{ matrix.target }}

      - name: Keep libtorrent and OpenSSL for the next run
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.native-cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/native-cache
          key: ${{ steps.setup.outputs.native-cache-key }}

      # The app is signed before it goes into the installer, and the installer
      # after, so both carry the signature. Each is one .exe in its own upload,
      # which signing/artifact-configuration.xml matches.
      - name: Upload the app for signing
        id: unsigned-app
        if: env.SIGNPATH_SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/ztorrent.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the app
        if: env.SIGNPATH_SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          # A release policy waits for an approver, who may take a while.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/signed-app

      - name: Use the signed app
        if: env.SIGNPATH_SIGN == 'true'
        run: cp target/signed-app/ztorrent.exe target/${{ matrix.target }}/release/ztorrent.exe

      # A prebuilt binary where there is one, rather than compiling it each run.
      - name: Install cargo-packager
        if: env.SHIP == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Package
        if: env.SHIP == 'true'
        env:
          # linuxdeploy is itself an AppImage, and runners have no FUSE to mount it.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: cargo packager --release -p ztorrent --target ${{ matrix.target }} --formats ${{ matrix.formats }}

      - name: Check the app carries its own libraries
        if: env.SHIP == 'true'
        run: sh scripts/check-standalone.sh ${{ matrix.target }}

      - name: Name the installers
        if: env.SHIP == 'true'
        run: sh scripts/rename-artifacts.sh target/packages "$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"

      - name: Upload the installer for signing
        id: unsigned-installer
        if: env.SIGNPATH_SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer-${{ matrix.name }}
          path: target/packages/ztorrent-*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer
        if: env.SIGNPATH_SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/signed-installer

      - name: Use the signed installer
        if: env.SIGNPATH_SIGN == 'true'
        run: cp target/signed-installer/ztorrent-*.exe target/packages/

      - uses: actions/upload-artifact@v7
        if: env.SHIP == 'true'
        with:
          name: ztorrent-native-${{ matrix.name }}
          path: |
            target/packages/ztorrent-*.dmg
            target/packages/ztorrent-*.exe
            target/packages/ztorrent-*.AppImage
            target/packages/ztorrent-*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: [test, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: ztorrent-native-*

      - name: Collect installers
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} release/ \;
          ls -lh release
          test "$(ls release | wc -l)" -eq 8 || { echo 'expected 8 installers'; exit 1; }

      # Every release opens with the one-line install, as build.yml's did: most
      # people arrive at a release page from a link, and the notes have to
      # stand on their own for them.
      - name: Write the install header
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          macOS and Linux, in one line:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/odexion/ztorrent/main/scripts/install.sh | sh
          ```

          Windows, in PowerShell:

          ```powershell
          powershell -ExecutionPolicy Bypass -c "irm https://raw.githubusercontent.com/odexion/ztorrent/main/scripts/install.ps1 | iex"
          ```

          Or take an installer from the assets below — the `.dmg` for macOS
          (`arm64` for Apple Silicon, `x64` for Intel), the `.exe` for Windows,
          the AppImage or `.deb` for Linux. Nothing else needs installing.

          ztorrent is now a native app, rebuilt in Rust on GPUI. Torrents,
          labels and preferences carry over from the Electron version. On
          Windows, start ztorrent yourself once after this update.
          EOF
          # SignPath Foundation asks for its policy on every release page.
          if [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            cat >> notes.md <<'EOF'

          ## Code signing policy

          Free code signing provided by [SignPath.io](https://about.signpath.io),
          certificate by [SignPath Foundation](https://signpath.org). Who may
          sign, and what ztorrent sends over the network, are in the
          [README](https://github.com/odexion/ztorrent#code-signing-policy).
          EOF
          fi

      # Upload into an existing release rather than failing on it, as build.yml
      # did: a tag can already have one, made by hand or by an earlier attempt.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A suffixed tag (v0.6.0-beta.1) is a prerelease, which
          # releases/latest -- the updater and install.sh -- skips.
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists — uploading into it"
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md \
              --generate-notes \
              $pre \
              release/*
          fi
