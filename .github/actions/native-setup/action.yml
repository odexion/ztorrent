name: native setup
description: >-
  What the native build needs on a fresh runner: GPUI's system libraries on
  Linux, Boost's headers, the Rust toolchain and a warm cargo cache. libtorrent
  and OpenSSL are compiled from source by the build itself.

inputs:
  target:
    description: Rust target triple to add; empty for the runner's own
    default: ''
  cache-key:
    description: Keeps each job's cargo cache apart
    required: true

outputs:
  native-cache-key:
    description: The key to save the native cache under
    value: ${{ steps.native.outputs.cache-primary-key }}
  native-cache-hit:
    description: Whether that exact key was restored, so there is nothing to save
    value: ${{ steps.native.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: GPUI's system libraries (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config perl make \
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
          libx11-dev libx11-xcb-dev libxcb1-dev libxi-dev libxcursor-dev libxrandr-dev \
          libfontconfig-dev libfreetype-dev

    # OpenSSL's Windows build needs a native Perl. Under `shell: bash` the perl
    # first on PATH is Git's MSYS one, which lacks modules Configure uses.
    - name: Strawberry Perl for OpenSSL (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        perl='C:\Strawberry\perl\bin\perl.exe'
        if [ ! -x "/c/Strawberry/perl/bin/perl.exe" ]; then
          choco install strawberryperl -y --no-progress
        fi
        echo "OPENSSL_SRC_PERL=$perl" >> "$GITHUB_ENV"

    # ring compiles its C with clang for Windows on Arm.
    - name: clang (Windows on Arm)
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      shell: bash
      run: |
        if ! command -v clang >/dev/null && [ ! -x "/c/Program Files/LLVM/bin/clang.exe" ]; then
          choco install llvm -y --no-progress
        fi
        echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"

    # The same headers on every platform, instead of three package managers'
    # different versions. libtorrent needs no compiled Boost library.
    - uses: actions/cache@v5
      id: boost
      with:
        path: ${{ runner.temp }}/boost-${{ env.BOOST_VERSION }}
        key: boost-headers-${{ env.BOOST_VERSION }}-${{ runner.os }}

    - name: Boost headers
      if: steps.boost.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ runner.temp }}
      # Relative paths only: Git's tar on Windows reads `D:` as a remote host.
      run: |
        curl -sSfL --retry 3 -o boost.tar.gz \
          "https://github.com/boostorg/boost/releases/download/boost-${BOOST_VERSION}/boost-${BOOST_VERSION}-b2-nodocs.tar.gz"
        tar -xzf boost.tar.gz "boost-${BOOST_VERSION}/boost"
        rm boost.tar.gz

    - name: Point the build at Boost
      shell: bash
      run: echo "BOOST_INCLUDE=${{ runner.temp }}/boost-${BOOST_VERSION}" >> "$GITHUB_ENV"

    # Pinned by commit, so the toolchain it installs is named here rather than
    # taken from the ref.
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable
        targets: ${{ inputs.target }}

    # Caches are saved from main only, and read everywhere. GitHub scopes a
    # cache to the ref that saved it, so one saved by a release tag could only
    # ever be read by that tag again: every release built from nothing. A tag
    # or pull request reads main's instead. rust-cache also drops this
    # workspace's own crates and incremental state, which keeps each entry
    # small enough that the jobs' caches together fit GitHub's 10 GB.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    # Compiled libtorrent and OpenSSL (crates/ztorrent-lt-sys/build.rs). Every
    # version bump reruns that build script, and without this it downloads and
    # compiles both again. Saved by the job, after it has built them.
    - name: Point the build at the native cache
      shell: bash
      run: echo "ZTORRENT_NATIVE_CACHE=${{ runner.temp }}/native-cache" >> "$GITHUB_ENV"

    - uses: actions/cache/restore@v5
      id: native
      with:
        path: ${{ runner.temp }}/native-cache
        key: native-libs-${{ inputs.cache-key }}-${{ hashFiles('crates/ztorrent-lt-sys/build.rs', 'Cargo.lock') }}
        restore-keys: native-libs-${{ inputs.cache-key }}-
